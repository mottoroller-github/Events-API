name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image
      - name: Build Docker image
        run: |
          docker buildx build --load -t events-api:latest .

      # Start the Docker container
      - name: Start Docker container
        run: |
          docker run -d \
            --name events-api \
            -p 5000:5000 \
            events-api:latest

      # Wait for the API to become available
      - name: Wait for API to start
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health; then
              echo "API is ready!"
              exit 0
            fi

            echo "Waiting for API to start..."
            sleep 2
          done

          echo "API failed to start!"
          docker logs events-api
          exit 1

      # Check the API health endpoint
      - name: Check API health
        run: |
          response=$(curl -fsS http://localhost:5000/api/health)

          echo "Health check response: $response"

          echo "$response" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'

          echo "Health check successful!"

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Run integration tests against the Docker container
      - name: Run tests
        env:
          EVENTS_API_BASE_URL: http://localhost:5000
        run: |
          python -m pytest -v

      # Stop and remove the Docker container
      - name: Stop Docker container
        if: always()
        run: |
          docker stop events-api || true
          docker rm events-api || true

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: production

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/events-api:${{ github.sha }}

      # Trigger Render deployment
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail-with-body \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

      # Wait for Render deployment and run smoke test
      - name: Smoke Test
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          echo "Waiting for Render API..."

          for i in {1..60}; do
            if curl -fsS "$RENDER_BASE_URL/api/health"; then
              echo ""
              echo "Render API is healthy!"
              exit 0
            fi

            echo "Waiting for deployment..."
            sleep 10
          done

          echo "Render deployment health check failed!"
          exit 1
